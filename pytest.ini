[pytest]
testpaths = tests/e2e
pythonpath = .
python_files = test_*.py
# Default: terminal only. Enable evidence explicitly via Makefile
# (make e2e-video / make e2e-demo / EVIDENCE=1) or pytest flags:
#   --video on --tracing on
# Screenshot of the real page is taken by conftest before the result card.
addopts =
    --browser chromium
    --video off
    --screenshot off
    --tracing off
markers =
    e2e: browser-based end-to-end test
    seed: extra SQL seeds applied after baseline (see @seed / helpers.seed)
    e2e_01_001: docs/e2e/01 — [E2E-01-001]
    e2e_01_002: docs/e2e/01 — [E2E-01-002]
    e2e_01_003: docs/e2e/01 — [E2E-01-003]
    e2e_01_007: docs/e2e/01 — [E2E-01-007]
    e2e_04_001: docs/e2e/04 — [E2E-04-001]
    e2e_04_002: docs/e2e/04 — [E2E-04-002]
    e2e_04_003: docs/e2e/04 — [E2E-04-003]
    e2e_04_004: docs/e2e/04 — [E2E-04-004]
    e2e_04_005: docs/e2e/04 — [E2E-04-005]
    e2e_04_006: docs/e2e/04 — [E2E-04-006]
    e2e_04_007: docs/e2e/04 — [E2E-04-007]
    e2e_04_009: docs/e2e/04 — [E2E-04-009]
    e2e_04_010: docs/e2e/04 — [E2E-04-010]
