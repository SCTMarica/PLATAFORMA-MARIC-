name: E2E

on:
  push:
    branches:
      - main
      - "ci/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Terminal suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build E2E images
        run: make e2e-build

      - name: Run E2E tests (terminal only)
        run: make e2e

      - name: Tear down E2E stack
        if: always()
        run: make e2e-down
