{% load site_i18n %}

<div class="site-header__toolbar d-flex align-items-center gap-3 flex-wrap justify-content-end">
  <div class="font-controls" role="group" aria-label="Controle de tamanho da fonte">
    <button type="button" class="font-controls__button" data-font-scale="decrease" aria-label="Diminuir fonte">A-</button>
    <button type="button" class="font-controls__button font-controls__button--status" data-font-scale="reset" aria-label="Restaurar fonte para 100%">100%</button>
    <button type="button" class="font-controls__button" data-font-scale="increase" aria-label="Aumentar fonte">A+</button>
  </div>

  <button type="button" class="theme-toggle" data-theme-toggle aria-label="Alternar tema" title="Alternar tema">
    <span class="theme-toggle__icon" aria-hidden="true"></span>
    <span class="visually-hidden" data-theme-toggle-label>Alternar tema</span>
  </button>

  <form method="post" action="{% url 'core:set-language' %}" class="language-switcher" aria-label="{% tr 'menu.language' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <span class="visually-hidden">{% tr 'menu.language' %}</span>
    <div class="language-switcher__options" role="group" aria-label="{% tr 'menu.language' %}">
      {% for language in available_languages %}
        <button type="submit" name="language" value="{{ language.code }}" class="language-switcher__button{% if language.code == current_language %} is-active{% endif %}">
          {{ language.code|upper }}
        </button>
      {% endfor %}
    </div>
  </form>
</div>
