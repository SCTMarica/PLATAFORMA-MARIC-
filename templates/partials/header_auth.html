{% load static site_i18n %}

<header class="site-header-auth sticky-top shadow-sm">
  <div class="container-xl site-header-auth__inner">
    <a class="site-header__brand d-flex align-items-center" href="{% url 'core:home' %}" aria-label="{{ site_settings.site_name|default:'Prefeitura de Marica' }}">
      {% if site_settings.logo_url %}
        <img class="site-header__logo" src="{{ site_settings.logo_url }}" alt="{{ site_settings.site_name|default:'Prefeitura de Marica' }}">
      {% else %}
        <img class="site-header__logo" src="{% static 'img/cropped-prefeitura_marica_horizontal_vermelho.png' %}" alt="Prefeitura de Marica">
      {% endif %}
    </a>

    {% include "partials/header_toolbar.html" %}
  </div>

  <div class="site-header-auth__accent" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
</header>
