{% comment %}
  Icones minimalistas do painel admin.
  Uso: {% include "core/partials/admin_icon.html" with icon="news" %}
{% endcomment %}
<svg class="admin-icon admin-icon--{{ icon|default:'default' }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if icon == "menu" %}
  <path d="M4 7h16M4 12h16M4 17h16"/>
  {% elif icon == "close" %}
  <path d="M6 6l12 12M18 6 6 18"/>
  {% elif icon == "home" %}
  <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/>
  {% elif icon == "dashboard" %}
  <rect x="4" y="4" width="7" height="7" rx="1"/>
  <rect x="13" y="4" width="7" height="7" rx="1"/>
  <rect x="4" y="13" width="7" height="7" rx="1"/>
  <rect x="13" y="13" width="7" height="7" rx="1"/>
  {% elif icon == "settings" %}
  <circle cx="12" cy="12" r="3"/>
  <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
  {% elif icon == "news" %}
  <path d="M6 4h9l3 3v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/>
  <path d="M15 4v3h3M8 11h8M8 15h8M8 19h5"/>
  {% elif icon == "forms" %}
  <path d="M8 4h8l2 2v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/>
  <path d="M9 10h6M9 14h6M9 18h4"/>
  {% elif icon == "shield" %}
  <path d="M12 3l7 3v6c0 4.5-3.2 7.4-7 9-3.8-1.6-7-4.5-7-9V6z"/>
  {% elif icon == "user" %}
  <circle cx="12" cy="8" r="3.5"/>
  <path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/>
  {% elif icon == "calendar" %}
  <rect x="4" y="5" width="16" height="15" rx="1"/>
  <path d="M8 3v4M16 3v4M4 10h16"/>
  {% elif icon == "users" %}
  <circle cx="9" cy="9" r="3"/>
  <path d="M3 19c0-3 2.7-5 6-5"/>
  <circle cx="17" cy="10" r="2.5"/>
  <path d="M14.5 19c0-2.2 1.8-4 4-4"/>
  {% elif icon == "chevron" %}
  <path d="M6 9l6 6 6-6"/>
  {% elif icon == "search" %}
  <circle cx="11" cy="11" r="6"/>
  <path d="M20 20l-4-4"/>
  {% elif icon == "plus" %}
  <path d="M12 5v14M5 12h14"/>
  {% elif icon == "filter" %}
  <path d="M4 5h16M7 12h10M10 19h4"/>
  {% elif icon == "external" %}
  <path d="M14 5h5v5M10 14 19 9M15 9h4v4"/>
  <path d="M19 5 9 15"/>
  {% elif icon == "back" %}
  <path d="M19 12H5M12 19l-7-7 7-7"/>
  {% elif icon == "image" %}
  <rect x="4" y="5" width="16" height="14" rx="2"/>
  <circle cx="9" cy="10" r="1.5"/>
  <path d="M4 16l4.5-4.5a1.5 1.5 0 0 1 2.1 0L20 18"/>
  {% elif icon == "palette" %}
  <circle cx="12" cy="12" r="8"/>
  <circle cx="9" cy="10" r="1.2" fill="currentColor" stroke="none"/>
  <circle cx="15" cy="10" r="1.2" fill="currentColor" stroke="none"/>
  <circle cx="12" cy="15" r="1.2" fill="currentColor" stroke="none"/>
  {% elif icon == "contact" %}
  <path d="M4 6h16v12H4z"/>
  <path d="M4 7l8 6 8-6"/>
  {% elif icon == "alert" %}
  <circle cx="12" cy="12" r="8"/>
  <path d="M12 8v5M12 16h.01"/>
  {% else %}
  <circle cx="12" cy="12" r="8"/>
  {% endif %}
</svg>
