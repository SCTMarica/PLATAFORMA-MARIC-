<header class="admin-list-page__header">
  <div class="admin-list-page__header-main">
    <div class="admin-page__head-icon">
      {% include "core/partials/admin_icon.html" with icon=list_icon %}
    </div>
    <div>
      <h1 class="admin-list-page__title">{{ list_title }}</h1>
      <p class="admin-list-page__subtitle">{{ list_subtitle }}</p>
    </div>
  </div>
  {% if create_url %}
  <a href="{{ create_url }}" class="admin-list-page__create btn btn-primary btn-sm">
    {% include "core/partials/admin_icon.html" with icon="plus" %}
    <span>{{ create_label }}</span>
  </a>
  {% endif %}
</header>
