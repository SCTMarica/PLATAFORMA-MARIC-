{% extends "base.html" %}
{% load site_i18n %}

{% block title %}{% tr 'titles.register' %} | {{ site_settings.site_name|default:"Plataforma Maric" }}{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="content-card p-4 p-lg-5">
          <p class="section-eyebrow mb-2">{% tr 'register.eyebrow' %}</p>
          <h1 class="h3 mb-3">{% tr 'register.title' %}</h1>
          <p class="text-secondary">{% tr 'register.subtitle' %}</p>
          <form class="row g-3">
            <div class="col-md-6">
              <label class="form-label">{% tr 'register.full_name' %}</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">{% tr 'register.email' %}</label>
              <input type="email" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">{% tr 'register.phone' %}</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">{% tr 'register.document' %}</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">{% tr 'register.password' %}</label>
              <input type="password" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">{% tr 'register.confirm_password' %}</label>
              <input type="password" class="form-control">
            </div>
            <div class="col-12">
              <button type="button" class="btn btn-primary">{% tr 'register.button' %}</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
