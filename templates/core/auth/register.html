{% extends "base.html" %}

{% block title %}Cadastro | {{ site_settings.site_name|default:"Plataforma Maric" }}{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="content-card p-4 p-lg-5">
          <p class="section-eyebrow mb-2">Entrada visual</p>
          <h1 class="h3 mb-3">Criar cadastro</h1>
          <p class="text-secondary">Estrutura pensada para evoluir depois para o cadastro completo de cliente final.</p>
          <form class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nome completo</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Telefone</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">CPF</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Senha</label>
              <input type="password" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Confirmar senha</label>
              <input type="password" class="form-control">
            </div>
            <div class="col-12">
              <button type="button" class="btn btn-primary">Cadastrar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
