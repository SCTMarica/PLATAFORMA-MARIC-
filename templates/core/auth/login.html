{% extends "base.html" %}
{% load site_i18n %}

{% block title %}{% tr 'titles.login' %} | {{ site_settings.site_name|default:"Plataforma Maric" }}{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="content-card p-4 p-lg-5">
          <p class="section-eyebrow mb-2">{% tr 'login.eyebrow' %}</p>
          <h1 class="h3 mb-3">{% tr 'login.title' %}</h1>
          <p class="text-secondary">{% tr 'login.subtitle' %}</p>
          <form class="d-grid gap-3">
            <div>
              <label class="form-label">{% tr 'login.user' %}</label>
              <input type="text" class="form-control" placeholder="{% tr 'login.placeholder_user' %}">
            </div>
            <div>
              <label class="form-label">{% tr 'login.password' %}</label>
              <input type="password" class="form-control" placeholder="********">
            </div>
            <button type="button" class="btn btn-primary">{% tr 'login.button' %}</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
