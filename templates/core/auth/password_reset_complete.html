{% extends "base.html" %}

{% block title %}Senha redefinida | {{ site_settings.site_name|default:"Plataforma Maric" }}{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="content-card p-4 p-lg-5">
          <p class="section-eyebrow mb-2">Acesso</p>
          <h1 class="h3 mb-3">Senha redefinida</h1>
          <p class="text-secondary">Sua senha foi atualizada. Use o login para acessar novamente.</p>
          <a class="btn btn-primary" href="{% url 'core:login' %}">Entrar</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
